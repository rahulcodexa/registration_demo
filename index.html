<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARWARI COLLEGE</title>
        <link rel="stylesheet" href="registration.css">
</head>
<body>

<center>
    <h1><u>WELCOME TO MARWARI COLLEGE</u></h1>

    <h2><u>Ranchi (Jharkhand)</u></h2>

    NAAC Accredited Autonomous College With Potential FOR Excellence

    <h3>
        <font color="red">
            A Unit Of Ranchi University
        </font>
    </h3>
</center>

<img src="https://images.shiksha.com/mediadata/images/1724138063phpWzm3Op.jpeg"
     style="position:absolute; top:20px; border:solid;
     border-radius:100px; height:180px; width: 180px;">

      
<div style="position:absolute; height:40px; width:1200px; left:180px">
    <button>Home</button>
    <button>Login</button>
    <button>Register</button>
    <button>About us</button>
    <button>Courses</button>
</div>


<br><br><br>

<table>
    <tr>
        <td>Enter Name</td>
        <td><input type="text"></td>
    </tr>

    <tr>
        <td>Reg No</td>
        <td><input type="text"></td>
    </tr>

    <tr>
        <td>Mobile No</td>
        <td><input type="text"></td>
    </tr>

    <tr>
        <td>Email Id</td>
        <td><input type="text"></td>
    </tr>

    <tr>
        <td>DOB</td>
        <td><input type="date"></td>
    </tr>

    <tr>
        <td>Address</td>
        <td><text area rows="5" cols="90"></text area></td>
    </tr>

    <tr>
        <td>Course</td>
        <td>
            <select>
                <option>Select The Course</option>
                <option>BCA</option>
                <option>B.Sc. IT</option>
                <option>BCS</option>
                <option>B.Sc. In AI&ML</option>
                <option>MBA</option>
                <option>MCA</option>
                <option>BBA</option>
                <option>diploma</option>
            </select>
        </td>
    </tr>

    <tr>
        <td>Gender</td>
        <td>
            <input type="radio" name="g">M
            <input type="radio" name="g">F
            <input type="radio" name="g">other
        </td>
    </tr>

    <tr>
        <td>Languages Known</td>
        <td>
            <input type="checkbox">Hindi
            <input type="checkbox">English
            <input type="checkbox">Nagpuri
            <input type="checkbox">Bhojpuri
        </td>
    </tr>

    <tr>
        <td>Upload Photo</td>
        <td><input type="file"></td>
    </tr>

    <tr>
        <td><button>SAVE</button></td>
        <td><button>RESET</button></td>
    </tr>
</table>

</body>
</html>
